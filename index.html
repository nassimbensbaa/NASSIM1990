<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>متجر VIP</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: sans-serif;
      background: #f3f4f6;
    }

    .card {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 15px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #16a34a;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #15803d;
    }

    .priceBox {
      background: #111827;
      color: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1 class="text-3xl font-bold text-center mb-5">
    🔥 ساعة ذكية برو MAX
  </h1>

  <img
    src="images/nassim.png"
    class="rounded-xl mb-5 w-full"
  >

  <div class="priceBox">
    <p>💰 السعر: <b>12990 دج</b></p>
  </div>

  <input type="text" id="firstName" placeholder="الاسم">

  <input type="text" id="lastName" placeholder="اللقب">

  <input type="tel" id="phone" placeholder="رقم الهاتف">

  <select id="state">
    <option value="">اختر الولاية</option>
    <option>الجزائر</option>
    <option>وهران</option>
    <option>باتنة</option>
    <option>سطيف</option>
    <option>البليدة</option>
  </select>

  <select id="deliveryType">
    <option value="office">📦 مكتب</option>
    <option value="home">🏠 منزل</option>
  </select>

  <button onclick="submitOrder()">
    تأكيد الطلب
  </button>

  <div id="message" class="text-center mt-4 font-bold"></div>

</div>

<script>

async function submitOrder() {

  const firstName =
    document.getElementById("firstName").value;

  const lastName =
    document.getElementById("lastName").value;

  const phone =
    document.getElementById("phone").value;

  const state =
    document.getElementById("state").value;

  const deliveryType =
    document.getElementById("deliveryType").value;

  if (!firstName || !lastName || !phone || !state) {

    document.getElementById("message").innerHTML =
      "❌ يرجى ملء جميع الحقول";

    return;
  }

  const shipping =
    deliveryType === "home" ? 700 : 400;

  const total =
    12990 + shipping;

  document.getElementById("message").innerHTML =
    "⏳ جاري إرسال الطلب...";

  try {

    const response = await fetch("/api/send", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        firstName,
        lastName,
        phone,
        state,
        deliveryType,
        shipping,
        total,
        productName: "ساعة ذكية برو MAX"

      })

    });

    const result = await response.json();

    if (result.ok) {

      document.getElementById("message").innerHTML =
        "✅ تم إرسال الطلب بنجاح";

      document.getElementById("firstName").value = "";
      document.getElementById("lastName").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("state").value = "";

    } else {

      document.getElementById("message").innerHTML =
        "❌ حدث خطأ";

    }

  } catch (error) {

    document.getElementById("message").innerHTML =
      "❌ فشل الاتصال بالسيرفر";

    console.log(error);

  }

}

</script>

</body>
</html>
