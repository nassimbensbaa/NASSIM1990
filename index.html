<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر VIP | اطلب الآن</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>

        @keyframes float {
            0%,100% {transform:translateY(0)}
            50% {transform:translateY(-10px)}
        }

        .title-float {
            animation: float 3s ease-in-out infinite;
            background: linear-gradient(135deg,#f59e0b,#ef4444);
            -webkit-background-clip:text;
            color:transparent;
        }

        .btn-glow {
            transition:.3s;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow:0 10px 20px rgba(0,0,0,.2);
        }

        input,select {
            border:2px solid #e5e7eb;
            transition:.2s;
        }

        input:focus,select:focus {
            border-color:#f59e0b;
        }

        .loading {
            width:18px;
            height:18px;
            border:3px solid #eee;
            border-top:3px solid #f59e0b;
            border-radius:50%;
            animation:spin .8s linear infinite;
            display:inline-block;
        }

        @keyframes spin {
            to {transform:rotate(360deg)}
        }

    </style>

</head>

<body class="bg-gray-100">

<div id="root"></div>

<script>

// ================= المنتج =================
const PRODUCT = {
    name: "🔥 ساعة ذكية برو MAX",
    price: 12990,
    discount: 28,
    image: "images/nassim.png"
};

const finalPrice =
    PRODUCT.price * (1 - PRODUCT.discount / 100);

// ================= الحالة =================
let formData = {
    firstName: "",
    lastName: "",
    phone: "",
    state: "",
    delivery: "office",
    loading: false,
    message: ""
};

// ================= سعر التوصيل =================
function shippingPrice(type){
    return type === "home" ? 700 : 400;
}

// ================= عرض الصفحة =================
function render(){

const shipping = shippingPrice(formData.delivery);
const total = finalPrice + shipping;

document.getElementById("root").innerHTML = `

<div class="max-w-4xl mx-auto p-4">

<div class="bg-white rounded-3xl shadow-xl p-6">

<h1 class="text-3xl font-bold text-center title-float">
${PRODUCT.name}
</h1>

<img src="${PRODUCT.image}" class="w-full rounded-xl mt-4">

<div class="text-center mt-4">
<span class="text-3xl font-bold">${Math.round(finalPrice)} دج</span>
</div>

<input id="firstName" placeholder="الاسم" class="w-full p-3 mt-4 rounded-xl">
<input id="lastName" placeholder="اللقب" class="w-full p-3 mt-2 rounded-xl">
<input id="phone" placeholder="رقم الهاتف" class="w-full p-3 mt-2 rounded-xl">

<select id="state" class="w-full p-3 mt-2 rounded-xl">
<option value="">اختر الولاية</option>
<option>الجزائر</option>
<option>وهران</option>
<option>باتنة</option>
<option>سطيف</option>
<option>قسنطينة</option>
</select>

<select id="delivery" class="w-full p-3 mt-2 rounded-xl">
<option value="office">توصيل للمكتب</option>
<option value="home">توصيل للمنزل</option>
</select>

<div class="bg-gray-800 text-white p-4 mt-4 rounded-xl">
💰 المجموع: ${Math.round(total)} دج
</div>

<button id="btn"
class="w-full mt-4 bg-green-600 text-white p-3 rounded-xl btn-glow">

${formData.loading ? `<span class="loading"></span> جاري الإرسال...` : "تأكيد الطلب"}

</button>

<p class="text-center mt-3">${formData.message}</p>

</div>

</div>

`;

// inputs
document.getElementById("firstName").oninput=e=>formData.firstName=e.target.value;
document.getElementById("lastName").oninput=e=>formData.lastName=e.target.value;
document.getElementById("phone").oninput=e=>formData.phone=e.target.value;
document.getElementById("state").onchange=e=>formData.state=e.target.value;
document.getElementById("delivery").onchange=e=>formData.delivery=e.target.value;

// submit
document.getElementById("btn").onclick = submitOrder;

}

// ================= إرسال الطلب =================
async function submitOrder(){

if(
!formData.firstName ||
!formData.lastName ||
!formData.phone ||
!formData.state
){
formData.message = "❌ أكمل جميع البيانات";
render();
return;
}

formData.loading = true;
render();

const shipping = shippingPrice(formData.delivery);
const total = finalPrice + shipping;

try {

const res = await fetch("/api/send", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
firstName: formData.firstName,
lastName: formData.lastName,
phone: formData.phone,
state: formData.state,
deliveryType: formData.delivery,
shipping,
total,
productName: PRODUCT.name
})
});

const data = await res.json();

if(data.ok){
formData.message = "✅ تم إرسال الطلب بنجاح";

formData.firstName = "";
formData.lastName = "";
formData.phone = "";
formData.state = "";

} else {
formData.message = "❌ فشل الإرسال";
}

} catch(err){
formData.message = "❌ خطأ في السيرفر";
}

formData.loading = false;
render();

}

render();

</script>

</body>
</html>
