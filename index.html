<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر VIP | اطلب الآن</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        @keyframes float {
            0%,100% {transform:translateY(0)}
            50% {transform:translateY(-10px)}
        }

        .title-float {
            animation: float 3s infinite;
            background: linear-gradient(135deg,#f59e0b,#ef4444);
            -webkit-background-clip:text;
            color:transparent;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
        }

        input,select {
            border:2px solid #e5e7eb;
            transition:.2s;
        }

        input:focus,select:focus {
            border-color:#f59e0b;
        }

        .loading {
            border:3px solid #eee;
            border-top:3px solid #f59e0b;
            border-radius:50%;
            width:18px;
            height:18px;
            animation:spin .8s linear infinite;
        }

        @keyframes spin {
            to {transform:rotate(360deg)}
        }
    </style>
</head>

<body class="bg-gray-100">

<div id="root"></div>

<script>

const PRODUCT = {
    name: "🔥 ساعة ذكية برو MAX",
    price: 12990,
    discount: 28,
    image: "images/nassim.png"
};

const finalPrice =
    PRODUCT.price * (1 - PRODUCT.discount / 100);

let formData = {
    firstName:"",
    lastName:"",
    phone:"",
    state:"",
    delivery:"office",
    loading:false,
    message:""
};

function getShipping(type){
    return type === "home" ? 700 : 400;
}

function render(){

const shipping = getShipping(formData.delivery);
const total = finalPrice + shipping;

document.getElementById("root").innerHTML = `

<div class="max-w-4xl mx-auto p-4">

<div class="bg-white rounded-3xl shadow-xl p-6">

<h1 class="text-3xl font-bold title-float text-center">
${PRODUCT.name}
</h1>

<img src="${PRODUCT.image}" class="w-full rounded-xl mt-4">

<div class="text-center mt-4">
<span class="text-3xl font-bold">${Math.round(finalPrice)} دج</span>
</div>

<input id="firstName" placeholder="الاسم" class="w-full p-3 mt-4 rounded-xl">
<input id="lastName" placeholder="اللقب" class="w-full p-3 mt-2 rounded-xl">
<input id="phone" placeholder="الهاتف" class="w-full p-3 mt-2 rounded-xl">

<select id="state" class="w-full p-3 mt-2 rounded-xl">
<option value="">الولاية</option>
<option>الجزائر</option>
<option>وهران</option>
<option>باتنة</option>
<option>سطيف</option>
</select>

<select id="delivery" class="w-full p-3 mt-2 rounded-xl">
<option value="office">مكتب</option>
<option value="home">منزل</option>
</select>

<div class="bg-gray-800 text-white p-4 mt-4 rounded-xl">
المجموع: ${Math.round(total)} دج
</div>

<button id="btn"
class="w-full mt-4 bg-green-600 text-white p-3 rounded-xl btn-glow">
${formData.loading ? "جاري الإرسال..." : "تأكيد الطلب"}
</button>

<p class="text-center mt-3">${formData.message}</p>

</div>

</div>

`;

document.getElementById("firstName").oninput=e=>formData.firstName=e.target.value;
document.getElementById("lastName").oninput=e=>formData.lastName=e.target.value;
document.getElementById("phone").oninput=e=>formData.phone=e.target.value;
document.getElementById("state").onchange=e=>formData.state=e.target.value;
document.getElementById("delivery").onchange=e=>formData.delivery=e.target.value;

document.getElementById("btn").onclick = submit;

}

async function submit(){

if(!formData.firstName||!formData.lastName||!formData.phone||!formData.state){
formData.message="❌ أكمل البيانات";
render();return;
}

formData.loading=true;
render();

const shipping = getShipping(formData.delivery);
const total = finalPrice + shipping;

try{

const res = await fetch("/api/send",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
firstName:formData.firstName,
lastName:formData.lastName,
phone:formData.phone,
state:formData.state,
deliveryType:formData.delivery,
shipping,
total,
productName:PRODUCT.name
})
});

const data = await res.json();

if(data.ok){
formData.message="✅ تم إرسال الطلب";
formData.firstName="";
formData.lastName="";
formData.phone="";
formData.state="";
}else{
formData.message="❌ خطأ في الإرسال";
}

}catch(e){
formData.message="❌ خطأ في السيرفر";
}

formData.loading=false;
render();

}

render();

</script>

</body>
</html>
